# Setelah vhost aktif, pasang sertifikat dengan Certbot.
# sudo certbot --nginx --redirect -d dw.pdg.web.id

server {
    listen 80;
    listen [::]:80;
    server_name dw.pdg.web.id;

    root /var/www/darmawanita/public;
    index index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(index|install|admin)\.php$ {
        # Halaman PHP hanya tersedia lewat HTTPS.
        if ($scheme = http) {
            return 308 https://dw.pdg.web.id$request_uri;
        }

        try_files $uri =404;
        include fastcgi.conf;
        # Cek socket PHP-FPM yang aktif dengan sudo ss -xlpn.
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~* \.(php|phtml|phar)(/|$) {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }
}
